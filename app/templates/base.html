<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Multi-Agent Research Web Interface">
  <title>{% block title %}Team Simulation Platform{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
  {% block extra_head %}{% endblock %}
</head>
<body>

<header>
  <a href="/" class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
    </svg>
    Team Simulation Platform
  </a>
  <nav>
    <a href="/">Home</a>
    <a href="/experiments">Experiments</a>
    <!-- In a real implementation with auth, show logout here -->
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<script src="/static/app.js?v=2"></script>
{% block scripts %}{% endblock %}
</body>
</html>
